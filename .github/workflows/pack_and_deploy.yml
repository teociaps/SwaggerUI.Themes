name: Pack and Deploy

on:
  release:
    types:
      - published

env:
    CONFIGURATION: 'Release'
    PACKAGE_OUTPUT: ${{ github.workspace }}/artifacts
    NUGET_SOURCE_URL: 'https://api.nuget.org/v3/index.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required so GitHub can mint the OIDC token NuGet Trusted Publishing exchanges for a short-lived API key

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        sparse-checkout: |
          .github
          src
          build

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Determine package family from release tag
      id: family
      shell: bash
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        if [[ "$TAG" == themes-v* ]]; then
          echo "filter=Themes" >> "$GITHUB_OUTPUT"
        elif [[ "$TAG" == extensions-v* ]]; then
          echo "filter=Extensions" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Release tag '$TAG' does not match themes-v* or extensions-v* — cannot determine package family to deploy." >&2
          exit 1
        fi

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget_login
      with:
        user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), NOT the email address

    - name: Pack & Push to NuGet
      shell: pwsh
      run: ./deploy.ps1 -Configuration ${{ env.CONFIGURATION }} -PackageOutput ${{ env.PACKAGE_OUTPUT }} -NuGetSourceUrl ${{ env.NUGET_SOURCE_URL }} -NuGetApiKey ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -Filter ${{ steps.family.outputs.filter }}